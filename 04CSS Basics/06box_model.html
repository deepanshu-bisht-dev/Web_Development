<!-- Every HTML element on a page is a rectangular box in the browser, and the Box Model defines how that box behaves. It’s the foundation of spacing, layout, and sizing in CSS. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Models</title>
<!-- What is the Box Model?
The box model consists of four layers, from innermost to outermost:

|---------------------------|
|         Margin            |
|  |---------------------|  |
|  |      Border         |  |
|  |  |---------------|  |  |
|  |  |   Padding      |  |  |
|  |  |  |---------|   |  |  |
|  |  |  | Content |   |  |  |
|  |  |  |---------|   |  |  |
|  |  |---------------|  |  |
|  |---------------------|  |
|---------------------------| 
-->
</head>
<body>
    <h1>Box Models</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Modi commodi id amet, voluptate, minus ab at sunt quaerat qui eaque impedit repellat delectus repellendus repudiandae fugiat consectetur quis minima! Veniam reiciendis eum pariatur deserunt sit?</p>
    <span>Span 1</span>
    <span>Span 2</span>    
</body>
</html>

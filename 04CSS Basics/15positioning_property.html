<!-- CSS Positioning allows you to move elements from their default flow and place them precisely where you want on the page.Its an essential part of creating modern and interactive layouts.
----  The Position Property - There are five main values:

Value for Position	     Description

static	              Default. Element stays in the normal document flow

relative	          Moves the element relative to its normal position

absolute	          Removes from flow; positions relative to nearest 
                      positioned ancestor

fixed	              Positions the element relative to the browser window,     
                      even on scroll

sticky	              Behaves like relative, but sticks to a position while     
                      scrolling -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning Properties</title>
    <style>
        /* 1. static - Every element is positioned static by default. */
        .container {
            width: 600px;
            height: 400px;
            border: 2px solid red;
        }
        .box1 {
            width: 250px;
            height: 100px;
            border: 2px solid green;
            background-color: aqua;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1">
            I am Box 1.
        </div>
    </div>
    
</body>
</html>

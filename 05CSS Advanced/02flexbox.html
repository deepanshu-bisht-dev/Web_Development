<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .container {
            width: 90vw;
            padding: 6px;
            border: 2px solid red;
            display: flex;
            /* flex-direction: column; */
            /* flex-direction: row-reverse; */
            justify-content: flex-end;
            /* justify-content: space-between; */
            flex-wrap: wrap;
        }

            .box {
                width: 100px;
                height: 50px;
                border: 2px solid green;
                margin: 5px;
            }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
        <div class="box">Box 4</div>
        <div class="box">Box 5</div>
    </div>

    <img width="600px" src="https://css-tricks.com/wp-content/uploads/2018/11/00-basic-terminology.svg" alt="Axis">
    <br><br>
    <p> Justify Content</p>
    <img width="500px" src="https://css-tricks.com/wp-content/uploads/2018/10/justify-content.svg"
        alt="Justify content images">
    <br><br>
    <p>Align Item</p>
    <img width="500px" src="https://css-tricks.com/wp-content/uploads/2018/10/align-items.svg" alt="Align Item">

</body>
</html>
